[project]
name = "pronunciation-coach"
version = "0.1.0"
description = "Local English pronunciation practice: read books aloud and get phoneme-level feedback."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "pypdf>=4.3",
    "pysbd>=0.3.4",
    "phonemizer>=3.3",
    "numpy>=1.26",
    "soundfile>=0.12",
    # Worker-process only (never imported by the FastAPI process):
    "torch>=2.7",
    "transformers>=4.44",
    "piper-tts>=1.8.0",
    "groq>=1.7.0",
]

[project.scripts]
pronunciation-coach = "pronunciation_coach.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pronunciation_coach"]

# Blackwell (sm_120) needs CUDA 12.8+ wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::SyntaxWarning"]
